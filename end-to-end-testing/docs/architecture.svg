<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Support Assistant architecture</title>
  <desc>Chat UI calls FastAPI. FastAPI searches the vector store for documents and calls the CRM tool, which reads PostgreSQL.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#444441"/>
    </marker>
  </defs>
  <rect width="720" height="380" fill="#ffffff"/>
  <text x="360" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2C2C2A">Support Assistant - Architecture</text>

  <rect x="30" y="150" width="130" height="64" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/>
  <text x="95" y="177" text-anchor="middle" font-size="15" font-weight="bold" fill="#2C2C2A">Chat UI</text>
  <text x="95" y="197" text-anchor="middle" font-size="12" fill="#444441">HTML / JS</text>

  <rect x="230" y="150" width="140" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
  <text x="300" y="177" text-anchor="middle" font-size="15" font-weight="bold" fill="#26215C">FastAPI</text>
  <text x="300" y="197" text-anchor="middle" font-size="12" fill="#3C3489">/chat  /draft-email</text>

  <rect x="470" y="60" width="200" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="570" y="87" text-anchor="middle" font-size="15" font-weight="bold" fill="#04342C">Vector store</text>
  <text x="570" y="107" text-anchor="middle" font-size="12" fill="#085041">Document search</text>

  <rect x="470" y="150" width="200" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="570" y="177" text-anchor="middle" font-size="15" font-weight="bold" fill="#04342C">CRM tool</text>
  <text x="570" y="197" text-anchor="middle" font-size="12" fill="#085041">Customer lookup</text>

  <rect x="470" y="260" width="200" height="64" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/>
  <text x="570" y="287" text-anchor="middle" font-size="15" font-weight="bold" fill="#2C2C2A">PostgreSQL</text>
  <text x="570" y="307" text-anchor="middle" font-size="12" fill="#444441">Customers and orders</text>

  <line x1="160" y1="182" x2="228" y2="182" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="370" y1="182" x2="468" y2="182" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M420 182 V92 H468" fill="none" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="570" y1="214" x2="570" y2="258" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="360" y="352" text-anchor="middle" font-size="12" fill="#444441">Document question: vector store.  Customer or order question: CRM tool, then PostgreSQL.  Unknown question: refusal.</text>
</svg>
