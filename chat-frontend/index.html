<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Document Chat</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 760px; margin: 30px auto; padding: 0 12px; }
  h2 { margin-bottom: 8px; }
  #messages { border: 1px solid #ccc; border-radius: 8px; height: 380px; overflow-y: auto; padding: 10px; background: #fafafa; }
  .msg { margin: 8px 0; padding: 8px 10px; border-radius: 8px; max-width: 85%; white-space: pre-wrap; }
  .user { background: #d9ebff; margin-left: auto; }
  .bot { background: #eee; }
  .sources { font-size: 12px; color: #555; margin-top: 6px; }
  .draft-btn { margin-top: 6px; }
  textarea.draft { width: 100%; height: 160px; margin-top: 6px; }
  #loading { display: none; color: #0066cc; margin: 6px 0; }
  #error { display: none; color: #b00020; background: #fdecea; padding: 8px; border-radius: 6px; margin: 6px 0; }
  #status { font-size: 13px; color: #2e7d32; margin: 6px 0; }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  .row input[type=text] { flex: 1; padding: 8px; }
  button { padding: 8px 14px; cursor: pointer; }
  .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid #0066cc; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<h2>Document Chat</h2>

<div>
  <input type="file" id="fileInput">
  <button id="uploadBtn">Upload document</button>
  <span id="status"></span>
</div>

<div id="messages"></div>
<div id="loading"><span class="spinner"></span>Thinking...</div>
<div id="error"></div>

<div class="row">
  <input type="text" id="messageBox" placeholder="Type your question...">
  <button id="sendBtn">Send</button>
</div>

<script>
const API = "http://127.0.0.1:8000";
const messagesEl = document.getElementById("messages");
const loadingEl = document.getElementById("loading");
const errorEl = document.getElementById("error");
const statusEl = document.getElementById("status");
const messageBox = document.getElementById("messageBox");
const sendBtn = document.getElementById("sendBtn");

function showError(text) { errorEl.textContent = text; errorEl.style.display = "block"; }
function clearError() { errorEl.style.display = "none"; }
function setLoading(on) {
  loadingEl.style.display = on ? "block" : "none";
  sendBtn.disabled = on;
}

function addMessage(text, who) {
  const div = document.createElement("div");
  div.className = "msg " + who;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

async function sendMessage() {
  const text = messageBox.value.trim();
  if (!text) return;
  clearError();
  addMessage(text, "user");
  messageBox.value = "";
  setLoading(true);
  try {
    const res = await fetch(API + "/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text }),
    });
    if (!res.ok) throw new Error("Server returned " + res.status);
    const data = await res.json();
    const botDiv = addMessage(data.answer, "bot");

    const src = document.createElement("div");
    src.className = "sources";
    src.textContent = "Sources: " + (data.sources.length ? data.sources.join(", ") : "none");
    botDiv.appendChild(src);

    const btn = document.createElement("button");
    btn.className = "draft-btn";
    btn.textContent = "Draft email";
    btn.onclick = () => draftEmail(botDiv, btn, text, data);
    botDiv.appendChild(btn);
  } catch (e) {
    showError("Sorry, something went wrong. Please check the server is running and try again.");
  } finally {
    setLoading(false);
  }
}

async function draftEmail(botDiv, btn, question, data) {
  clearError();
  btn.disabled = true;
  btn.textContent = "Drafting...";
  try {
    const res = await fetch(API + "/draft-email", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, answer: data.answer, sources: data.sources }),
    });
    if (!res.ok) throw new Error("Server returned " + res.status);
    const d = await res.json();
    let ta = botDiv.querySelector("textarea");
    if (!ta) {
      ta = document.createElement("textarea");
      ta.className = "draft";
      botDiv.appendChild(ta);
    }
    ta.value = d.draft;
  } catch (e) {
    showError("Could not create the email draft. Please try again.");
  } finally {
    btn.disabled = false;
    btn.textContent = "Draft email";
  }
}

document.getElementById("uploadBtn").onclick = async () => {
  const file = document.getElementById("fileInput").files[0];
  if (!file) { showError("Please choose a file first."); return; }
  clearError();
  statusEl.style.color = "#0066cc";
  statusEl.textContent = "Uploading...";
  const form = new FormData();
  form.append("file", file);
  try {
    const res = await fetch(API + "/documents", { method: "POST", body: form });
    if (!res.ok) throw new Error("Server returned " + res.status);
    const d = await res.json();
    statusEl.style.color = "#2e7d32";
    statusEl.textContent = "Uploaded: " + d.filename;
  } catch (e) {
    statusEl.textContent = "";
    showError("Upload failed. Please check the server is running and try again.");
  }
};

sendBtn.onclick = sendMessage;
messageBox.addEventListener("keydown", e => { if (e.key === "Enter") sendMessage(); });
</script>
</body>
</html>
